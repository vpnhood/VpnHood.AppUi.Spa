<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VpnHood App</title>
    <style>
      /* Paint the app's dark background before any bundle loads, so a refresh never flashes
         white. Matches the VpnHoodClient theme background (purple-500 in src/theme/colors.ts);
         the Connect theme is close enough that the difference is imperceptible for one frame. */
      html { background-color: #150e3d; color-scheme: dark; }

      /* Vuetify's cascade-layer priority is fixed by whichever stylesheet declares a layer
         first, and the built bundle links split per-component CSS (VBtn, VCard, ...) ahead of
         the chunk carrying Vuetify's own order statement — inverting the layers so the
         vuetify-core reset overrides component sizing (e.g. small buttons inherit the app
         font size). Pinning the order here, before any stylesheet link, keeps the layers in
         Vuetify's intended order. Mirrors vuetify/lib/styles/main.css verbatim — the
         Vuetify-3 grid compat in override.css relies on vuetify-utilities outranking
         vuetify-components, so keep the full list in sync when upgrading Vuetify. */
      @layer vuetify-core { @layer reset, base; }
      @layer vuetify-components;
      @layer vuetify-overrides;
      @layer vuetify-utilities { @layer theme-base; @layer typography; @layer helpers; @layer theme-background; @layer theme-foreground; }
      @layer vuetify-final { @layer transitions, trumps; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
